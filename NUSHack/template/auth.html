<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - BITS</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="app-header">
    <span class="brand">BITS</span>
  </header>

  <main class="auth">
    <h1>Log in</h1>

    {% if error %}
    <p class="form-error" id="auth-error" role="alert">{{ error }}</p>
    {% endif %}

    <form id="auth-form" method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" maxlength="254" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" maxlength="72" autocomplete="current-password" required>

      <button type="submit">Log in</button>
    </form>

    <p>Need an account? Ask your admin.</p>
  </main>
</body>
</html>
