<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BITS</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="app-header">
    <span class="brand">BITS</span>
    <p id="status" role="status" data-state="checking">
      <span id="status-text">Checking...</span>
    </p>
  </header>

  <main>
    <div class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" id="tab-home" type="button" role="tab" aria-controls="panel-home" aria-selected="true">Home</button>
      <button class="tab" id="tab-message" type="button" role="tab" aria-controls="panel-message" aria-selected="false" tabindex="-1">Message</button>
      <button class="tab" id="tab-checklist" type="button" role="tab" aria-controls="panel-checklist" aria-selected="false" tabindex="-1">Checklist</button>
    </div>

    <section id="panel-home" role="tabpanel" aria-labelledby="tab-home">
      <h1>Welcome to BITS</h1>
      <p>Your all-in-one security assistant for patrols, checkpoints and more.</p>
      <button id="get-started" type="button">Get Started</button>
    </section>

    <section id="panel-message" role="tabpanel" aria-labelledby="tab-message" hidden>
      <h2>Messages</h2>
      <ul class="record-list" id="message-list"></ul>
      <p id="message-empty">No messages yet.</p>
      <form id="message-form">
        <label for="message-text">New message</label>
        <div class="message-row">
          <input id="message-text" type="text" maxlength="500" autocomplete="off" required>
          <button type="submit">Send</button>
        </div>
        <p class="form-error" id="message-error" role="alert"></p>
      </form>
    </section>

    <section id="panel-checklist" role="tabpanel" aria-labelledby="tab-checklist" hidden>
      <h2 id="checklist-title"></h2>
      <form id="checklist-form">
        <div id="checklist-items"></div>
        <p class="form-error" id="checklist-error" role="alert"></p>
        <button type="submit">Submit checklist</button>
      </form>
      <h2>Recent inspections</h2>
      <ul class="record-list" id="inspection-list"></ul>
      <p id="inspection-empty">No inspections yet.</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
